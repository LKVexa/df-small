name: Import verified source
on:
  push:
    branches: [main]
    paths: ['.github/workflows/import-source.yml', '.source-import.zip']
permissions:
  contents: read
jobs:
  import:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify and unpack the audited source archive
        shell: python
        run: |
          import hashlib, pathlib, stat, zipfile
          root = pathlib.Path.cwd().resolve()
          archive = root / '.source-import.zip'
          if not archive.exists():
              print('Source import already completed.')
              raise SystemExit(0)
          assert hashlib.sha256(archive.read_bytes()).hexdigest() == '557f7f7edb0965973f389023b500c45f9fddc0aa4c654a5050a8dfcf640d3410', 'Source archive digest mismatch'
          with zipfile.ZipFile(archive) as source:
              entries = source.infolist()
              assert len(entries) == 160
              assert sum(item.file_size for item in entries) < 100 * 1024 * 1024
              seen = set()
              for item in entries:
                  path = pathlib.PurePosixPath(item.filename)
                  assert not path.is_absolute() and '..' not in path.parts and '\\' not in item.filename
                  assert path.parts and not any(part in {'.git', '.github', '.state', 'node_modules', '__pycache__'} for part in path.parts)
                  assert not stat.S_ISLNK(item.external_attr >> 16)
                  assert item.filename not in seen
                  seen.add(item.filename)
                  target = (root / path).resolve()
                  assert target.is_relative_to(root) and not target.is_symlink()
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(source.read(item))
          archive.unlink()
      - name: Commit the verified source tree
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Import audited source with verified SHA-256'
          git push origin HEAD:main
